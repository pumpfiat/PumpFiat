<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">A responsible B2B cold email workflow</title>
  <desc id="desc">Five connected steps: define the ideal customer, research a relevant prospect, write a specific message, follow up respectfully, and measure qualified outcomes.</desc>
  <rect width="1200" height="420" rx="28" fill="#f3faf9"/>
  <text x="60" y="70" fill="#17212b" font-family="Arial,sans-serif" font-size="30" font-weight="700">A better B2B cold email workflow</text>
  <g font-family="Arial,sans-serif" text-anchor="middle">
    <path d="M225 215h110m130 0h110m130 0h110m130 0h110" stroke="#9bcbd0" stroke-width="8" stroke-linecap="round"/>
    <g transform="translate(145 215)">
      <circle r="65" fill="#00778c"/><text y="-4" fill="#fff" font-size="19" font-weight="700">01</text><text y="23" fill="#fff" font-size="16">Define ICP</text>
    </g>
    <g transform="translate(365 215)">
      <circle r="65" fill="#00778c"/><text y="-4" fill="#fff" font-size="19" font-weight="700">02</text><text y="23" fill="#fff" font-size="16">Research</text>
    </g>
    <g transform="translate(585 215)">
      <circle r="65" fill="#00778c"/><text y="-4" fill="#fff" font-size="19" font-weight="700">03</text><text y="23" fill="#fff" font-size="16">Write clearly</text>
    </g>
    <g transform="translate(805 215)">
      <circle r="65" fill="#00778c"/><text y="-4" fill="#fff" font-size="19" font-weight="700">04</text><text y="23" fill="#fff" font-size="16">Follow up</text>
    </g>
    <g transform="translate(1025 215)">
      <circle r="65" fill="#00778c"/><text y="-4" fill="#fff" font-size="19" font-weight="700">05</text><text y="23" fill="#fff" font-size="16">Learn &amp; refine</text>
    </g>
  </g>
  <text x="600" y="350" fill="#40515c" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">Relevance and recipient choice matter more than sending volume.</text>
</svg>
