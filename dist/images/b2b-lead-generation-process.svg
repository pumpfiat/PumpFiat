<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">B2B lead generation process</title>
  <desc id="desc">A five-step process: define an ideal customer, select relevant channels, research and engage prospects, qualify fit and need, then measure outcomes and refine.</desc>
  <rect width="1200" height="420" rx="28" fill="#f3faf9"/>
  <text x="60" y="70" fill="#17212b" font-family="Arial,sans-serif" font-size="30" font-weight="700">A repeatable B2B lead generation process</text>
  <path d="M225 215h110m130 0h110m130 0h110m130 0h110" stroke="#9bcbd0" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#fff">
    <g transform="translate(145 215)"><circle r="65" fill="#00778c"/><text y="-4" font-size="19" font-weight="700">01</text><text y="23" font-size="15">Define ICP</text></g>
    <g transform="translate(365 215)"><circle r="65" fill="#00778c"/><text y="-4" font-size="19" font-weight="700">02</text><text y="23" font-size="15">Choose channels</text></g>
    <g transform="translate(585 215)"><circle r="65" fill="#00778c"/><text y="-4" font-size="19" font-weight="700">03</text><text y="23" font-size="15">Research &amp; engage</text></g>
    <g transform="translate(805 215)"><circle r="65" fill="#00778c"/><text y="-4" font-size="19" font-weight="700">04</text><text y="23" font-size="15">Qualify fit</text></g>
    <g transform="translate(1025 215)"><circle r="65" fill="#00778c"/><text y="-4" font-size="19" font-weight="700">05</text><text y="23" font-size="15">Measure &amp; learn</text></g>
  </g>
  <text x="600" y="350" fill="#40515c" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">Qualified opportunities—not raw contact volume—are the goal.</text>
</svg>
