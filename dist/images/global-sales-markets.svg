<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Ten markets to consider for global sales hiring</title>
  <desc id="description">A world map-inspired illustration listing the Philippines, South Africa, Nigeria, India, Colombia, Argentina, Poland, Romania, Mexico, and Kenya as markets to research for remote sales hiring.</desc>
  <rect width="1200" height="360" fill="#effafb"/>
  <text x="600" y="52" text-anchor="middle" fill="#15343a" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">Global sales talent: start with your customer and role</text>
  <g fill="#b9e2e5">
    <path d="M92 123l25-31 50-8 24 16 31-4 30 23-10 24-27 4-17 26-38 4-13 25-35-9-10-25-24-9z"/>
    <path d="M227 206l30 9 22 38-7 35-20 30-17-23-10-42-16-18z"/>
    <path d="M428 111l37-21 45 4 25 15 37-3 27 16 40-12 37 10 5 19-33 10-19 20-40-8-27 18-21-9-21 17-28-15-33 10-21-20-26-6z"/>
    <path d="M525 190l35 2 22 25-12 44-20 34-17-14-17-44z"/>
    <path d="M717 111l38-9 29 18 42-1 35 20 60-7 37 25-13 24-42 2-17 21-45 2-26 20-36-16-23-29-28-11-9-29-27-10z"/>
    <path d="M945 236l35 2 29 20-16 20-36-3-26-19z"/>
  </g>
  <g font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#075b68">
    <g><circle cx="185" cy="147" r="7" fill="#00778c"/><text x="197" y="153">Mexico</text></g>
    <g><circle cx="247" cy="194" r="7" fill="#00778c"/><text x="259" y="200">Colombia</text></g>
    <g><circle cx="278" cy="250" r="7" fill="#00778c"/><text x="290" y="256">Argentina</text></g>
    <g><circle cx="605" cy="173" r="7" fill="#00778c"/><text x="617" y="179">Nigeria</text></g>
    <g><circle cx="644" cy="197" r="7" fill="#00778c"/><text x="656" y="203">Kenya</text></g>
    <g><circle cx="702" cy="131" r="7" fill="#00778c"/><text x="714" y="137">Poland / Romania</text></g>
    <g><circle cx="786" cy="167" r="7" fill="#00778c"/><text x="798" y="173">India</text></g>
    <g><circle cx="889" cy="235" r="7" fill="#00778c"/><text x="901" y="241">South Africa</text></g>
    <g><circle cx="1095" cy="201" r="7" fill="#00778c"/><text x="1083" y="226" text-anchor="end">Philippines</text></g>
  </g>
  <text x="600" y="328" text-anchor="middle" fill="#52666a" font-family="Inter,Arial,sans-serif" font-size="15">Markets to evaluate—not a ranking of candidate quality or compensation</text>
</svg>
