<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Compare in-house, outsourced, and hybrid SDR models</title>
  <desc id="desc">Three sales development operating models compared across control, operational responsibility, and flexibility.</desc>
  <rect width="1200" height="480" rx="28" fill="#f3faf9"/>
  <text x="60" y="72" fill="#17212b" font-family="Arial,sans-serif" font-size="30" font-weight="700">Choose a sales development model that fits your process</text>
  <g font-family="Arial,sans-serif">
    <rect x="60" y="120" width="330" height="285" rx="20" fill="#fff" stroke="#b9dfe1" stroke-width="2"/>
    <rect x="435" y="120" width="330" height="285" rx="20" fill="#fff" stroke="#b9dfe1" stroke-width="2"/>
    <rect x="810" y="120" width="330" height="285" rx="20" fill="#fff" stroke="#b9dfe1" stroke-width="2"/>
    <text x="225" y="170" text-anchor="middle" fill="#00778c" font-size="23" font-weight="700">In-house SDR</text>
    <text x="600" y="170" text-anchor="middle" fill="#00778c" font-size="23" font-weight="700">Outsourced SDR</text>
    <text x="975" y="170" text-anchor="middle" fill="#00778c" font-size="23" font-weight="700">Hybrid team</text>
    <text x="90" y="220" fill="#263642" font-size="18">Direct management</text><text x="90" y="257" fill="#263642" font-size="18">Internal knowledge</text><text x="90" y="294" fill="#263642" font-size="18">More hiring &amp; coaching</text><text x="90" y="345" fill="#52616a" font-size="16">Best fit: repeatable, core motion</text>
    <text x="465" y="220" fill="#263642" font-size="18">Provider-run execution</text><text x="465" y="257" fill="#263642" font-size="18">Defined service scope</text><text x="465" y="294" fill="#263642" font-size="18">Less direct oversight</text><text x="465" y="345" fill="#52616a" font-size="16">Best fit: capacity or market test</text>
    <text x="840" y="220" fill="#263642" font-size="18">Shared responsibilities</text><text x="840" y="257" fill="#263642" font-size="18">Internal strategy ownership</text><text x="840" y="294" fill="#263642" font-size="18">Requires clear handoffs</text><text x="840" y="345" fill="#52616a" font-size="16">Best fit: control + extra capacity</text>
  </g>
  <text x="600" y="450" fill="#40515c" font-family="Arial,sans-serif" font-size="18" text-anchor="middle">Compare complete costs, qualified outcomes, data rights, and management needs—not labels alone.</text>
</svg>
