<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Five steps to hire a remote SDR</title>
  <desc id="description">Define the role, source candidates, interview consistently, assess relevant skills fairly, and onboard with coaching.</desc>
  <rect width="1200" height="360" fill="#effafb"/>
  <text x="600" y="52" text-anchor="middle" fill="#15343a" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700">A focused remote SDR hiring process</text>
  <path d="M142 174H1058" stroke="#9bd1d7" stroke-width="8" stroke-linecap="round"/>
  <g font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g transform="translate(145 174)"><circle r="49" fill="#00778c"/><text y="10" fill="#fff" font-size="28" font-weight="700">1</text><text y="82" fill="#15343a" font-size="17" font-weight="700">Define role</text><text y="107" fill="#52666a" font-size="13">Work · outcomes</text></g>
    <g transform="translate(372 174)"><circle r="49" fill="#00778c"/><text y="10" fill="#fff" font-size="28" font-weight="700">2</text><text y="82" fill="#15343a" font-size="17" font-weight="700">Source candidates</text><text y="107" fill="#52666a" font-size="13">Channels · criteria</text></g>
    <g transform="translate(600 174)"><circle r="49" fill="#00778c"/><text y="10" fill="#fff" font-size="28" font-weight="700">3</text><text y="82" fill="#15343a" font-size="17" font-weight="700">Interview</text><text y="107" fill="#52666a" font-size="13">Consistent questions</text></g>
    <g transform="translate(828 174)"><circle r="49" fill="#00778c"/><text y="10" fill="#fff" font-size="28" font-weight="700">4</text><text y="82" fill="#15343a" font-size="17" font-weight="700">Assess fairly</text><text y="107" fill="#52666a" font-size="13">Fictional work sample</text></g>
    <g transform="translate(1055 174)"><circle r="49" fill="#00778c"/><text y="10" fill="#fff" font-size="28" font-weight="700">5</text><text y="82" fill="#15343a" font-size="17" font-weight="700">Onboard</text><text y="107" fill="#52666a" font-size="13">Practice · coaching</text></g>
  </g>
  <text x="600" y="328" text-anchor="middle" fill="#52666a" font-family="Inter,Arial,sans-serif" font-size="15">Use job-related evidence and a clear, respectful candidate experience at every stage</text>
</svg>
